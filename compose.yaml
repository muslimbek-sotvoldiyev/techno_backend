services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-katyol}
      POSTGRES_USER: ${POSTGRES_USER:-katyol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-katyol}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-katyol}?schema=public
      HOST: 0.0.0.0
      PORT: 3001
      NODE_ENV: production
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3001"

volumes:
  postgres_data:
